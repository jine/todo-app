<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module" src="../dist/index.js"></script>
</head>
<body class="bg-gray-900 font-['Open_Sans'] text-white">
    <div class="container bg-gray-800 max-w-[600px] mx-auto p-4 m-4 rounded-lg border border-gray-700 shadow-lg">
        <h1 class="font-bold mb-4 text-4xl text-center">ToDo App</h1>
        <p>Nedan är en simpel todo-app med localStorage och events mm skriven i TypeScript.</P>

        <button id="clearBtn" class="bg-purple-800 hover:bg-purple-900 text-white p-2 rounded-lg my-4">Återställ ToDos</button>

        <h2 class="font-bold text-xl my-4">Lägg till ny Todo</h2>

        <!-- Input form -->
        <form id="addForm" method="post" class="flex gap-2 mb-4">
            <input type="text" id="addInput" name="task" required value="" placeholder="Skriv din todo här..." class="flex-1 p-2 border border-gray-600 rounded-lg bg-gray-700 text-white">
            <button type="submit" class="bg-blue-600 hover:bg-blue-800 text-white font-bold p-3 rounded-lg">Lägg till</button>
        </form>

        <!-- The actual app output via TS-->
        <div id="app"></div>
    </div>
</body>
</html>
