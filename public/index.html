<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module" src="../dist/index.js"></script>
</head>
<body class="font-['Open_Sans'] text-white bg-gray-900">
    <div class="container m-4 mx-auto p-4 max-w-[600px] bg-gray-800 border border-gray-700 shadow-lg rounded-lg">
        <h1 class="mb-4 font-bold text-4xl text-center">ToDo App</h1>
        <p>Nedan är en simpel todo-app med localStorage och events mm skriven i TypeScript.</P>

        <button id="clearBtn" class="my-4 p-2 text-white bg-purple-800 hover:bg-purple-900 rounded-lg">Återställ ToDos</button>

        <h2 class="my-4 font-bold text-xl">Lägg till ny Todo</h2>

        <!-- Input form -->
        <form id="addForm" method="post" class="flex gap-2 mb-4">
            <input type="text" id="addInput" name="task" required value="" minlength="5" placeholder="Skriv din todo här..." class="flex-1 p-2 text-white bg-gray-700 border border-gray-600 rounded-lg">
            <button type="submit" class="p-3 font-bold text-white bg-blue-600 hover:bg-blue-800 rounded-lg">Lägg till</button>
        </form>

        <!-- The actual app output via TS-->
        <div id="app"></div>
    </div>
</body>
</html>
